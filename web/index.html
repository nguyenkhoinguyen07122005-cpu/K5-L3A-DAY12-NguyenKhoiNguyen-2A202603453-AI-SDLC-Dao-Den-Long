<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  /* Bang mau co dinh (Ticket-02, Part 3): UI text #F5F1E6, vang #F2C14E, nguy hiem #FF5A5F, Gio Lac #8FA3B8 */
  :root { --fs:1; --ink:#F5F1E6; --gold:#F2C14E; --danger:#FF5A5F; --wind:#8FA3B8; --lamp:#FFB347; --panel:rgba(14,20,48,.66); }
  body.big { --fs:1.25; }
  body { font-size:calc(18px * var(--fs)); }
  body.rm *, body.rm *::before { animation:none !important; transition:none !important; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0E1430; font-family: system-ui, "Segoe UI", sans-serif; color:var(--ink); }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; pointer-events:none; }
  body.nohud .hud, body.nohud #arrow { display:none !important; }
  .box { background:var(--panel); border:1px solid rgba(245,241,230,.14); border-radius:12px; padding:8px 14px; }
  #flames { top:12px; left:12px; font-size:calc(24px * var(--fs)); letter-spacing:3px; }
  #timer { top:12px; left:50%; transform:translateX(-50%); font-size:calc(32px * var(--fs)); font-weight:700; font-variant-numeric:tabular-nums; text-align:center; min-width:96px; }
  #timer.low { color:var(--danger); }
  #timer.low.blink { opacity:.25; }
  #timer small { display:block; font-size:calc(18px * var(--fs)); font-weight:400; opacity:.75; }
  #topright { top:12px; right:12px; text-align:right; }
  #lanternCount { font-size:calc(20px * var(--fs)); font-weight:700; }
  #lanternCount.danger::before { content:'⚠ '; }
  #cap { font-size:calc(18px * var(--fs)); opacity:.9; }
  body.cb { --danger:#FFFFFF; }
  body.cb #banner.danger { color:#FFFFFF; border:1px solid #FFFFFF; }
  #banner.danger { color:var(--danger); }
  #timer.low::before { content:'⚠ '; }
  #score { font-size:calc(26px * var(--fs)); font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  #motebar { bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:5px; padding:8px 12px; }
  #motebar i { width:18px; height:18px; border-radius:50%; background:rgba(245,241,230,.16); display:inline-block; }
  #motebar i.on { background:#FFF6C2; box-shadow:0 0 8px #FFE58A; }
  #cds { bottom:18px; right:18px; display:flex; gap:10px; }
  .cd { position:relative; width:112px; height:76px; white-space:nowrap; border-radius:12px; text-align:center; background:var(--panel); border:1px solid rgba(245,241,230,.2); overflow:hidden; font-size:calc(18px * var(--fs)); }
  .cd b { display:block; font-size:calc(20px * var(--fs)); margin-top:6px; }
  .cd .fill { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); height:0; }
  .cd.ready { border-color:var(--gold); }
  #prompt { bottom:70px; left:50%; transform:translateX(-50%); font-size:calc(18px * var(--fs)); opacity:0; color:var(--gold); }
  #prompt.show { opacity:1; }
  #banner { top:92px; left:50%; transform:translateX(-50%); font-size:calc(18px * var(--fs)); opacity:0; transition:opacity .25s; text-align:center; }
  #banner.show { opacity:1; }
  #banner.wind { color:var(--wind); border-color:var(--wind); }
  #charm { top:70px; left:12px; color:#C8102E; font-weight:700; opacity:0; }
  #charm.show { opacity:1; background:var(--panel); }
  #arrow { position:fixed; width:34px; height:34px; margin:-17px 0 0 -17px; pointer-events:none; display:none; color:var(--gold); font-size:calc(30px * var(--fs)); text-align:center; line-height:34px; text-shadow:0 0 8px #000; }
  #subs { top:150px; left:50%; transform:translateX(-50%); text-align:center; display:none; max-width:70vw; }
  #subs.show { display:block; }
  #subs div { margin:2px 0; }
  #arrow2 { position:fixed; width:44px; height:44px; margin:-22px 0 0 -22px; pointer-events:none; display:none; color:var(--danger); font-size:34px; text-align:center; line-height:44px; text-shadow:0 0 8px #000; }
  body.cb #arrow2 { color:#FFFFFF; }
  .krow { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:6px 0; text-align:left; }
  .krow button { width:170px !important; margin:0 !important; padding:6px 10px !important; }
  #screen table.lb { width:100%; border-collapse:collapse; text-align:left; margin:10px 0; }
  #screen table.lb td, #screen table.lb th { padding:4px 8px; border-bottom:1px solid rgba(245,241,230,.15); }
  #screen input[type=text] { width:100%; box-sizing:border-box; padding:9px 12px; font-size:18px; color:var(--ink); background:rgba(245,241,230,.1); border:1px solid rgba(245,241,230,.4); border-radius:8px; font-family:inherit; }
  #screen .msg { min-height:1.6em; }
  #screen.hero { background:radial-gradient(ellipse at 50% 40%, rgba(20,26,70,.35) 0%, rgba(6,8,24,.88) 78%); overflow:hidden; }
  #screen.hero .card { background:transparent; border:none; box-shadow:none; max-width:560px; }
  #screen.hero h1 { font-size:calc(64px * var(--fs)); letter-spacing:.04em; background:linear-gradient(180deg,#fff3c4 0%,#f2c14e 55%,#d8782f 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 0 18px rgba(242,193,78,.55)); margin-bottom:4px; }
  #screen.hero h2 { letter-spacing:.35em; opacity:.9; color:#cfe2ff; margin-bottom:16px; }
  #screen.hero p { color:#e7ecff; text-shadow:0 1px 6px #000; }
  #screen.hero button { border-radius:999px; background:rgba(14,20,48,.7); border-color:rgba(242,193,78,.45); backdrop-filter:blur(3px); transition:transform .15s, box-shadow .15s, background .15s; }
  #screen.hero button.primary { background:linear-gradient(90deg,#f2c14e,#e58a3a); color:#2a1606; border:none; font-weight:700; box-shadow:0 0 26px rgba(242,193,78,.55); }
  #screen.hero button:hover, #screen.hero button:focus { transform:scale(1.03); box-shadow:0 0 22px rgba(242,193,78,.5); }
  .fl { position:absolute; bottom:-60px; width:26px; height:34px; border-radius:50% 50% 45% 45%; background:radial-gradient(circle at 50% 40%, #fff2b8 0%, #ffb347 55%, #c8501e 100%); box-shadow:0 0 28px 10px rgba(255,170,70,.45); opacity:.85; animation:flfloat linear infinite; pointer-events:none; }
  @keyframes flfloat { from { transform:translateY(0) translateX(0) scale(1); opacity:0; } 10% { opacity:.9; } 50% { transform:translateY(-55vh) translateX(26px) scale(1.1); } to { transform:translateY(-120vh) translateX(-18px) scale(.9); opacity:0; } }
  #screen:not(.hero) .fl { display:none; }
  .sarrow { position:fixed; width:76px; height:76px; margin:-38px 0 0 -38px; pointer-events:none; display:none; z-index:6; text-align:center; }
  .sarrow b { display:block; font-size:54px; line-height:60px; color:#c9c9d6; text-shadow:0 0 10px #000, 0 0 18px rgba(0,0,0,.7); transform-origin:50% 50%; }
  .sarrow.hot b { color:#ff4a5a; text-shadow:0 0 12px #ff1c35, 0 0 26px rgba(255,40,60,.9); }
  .sarrow.stun b { color:#6fd0ff; text-shadow:0 0 12px #2aa6ff; }
  .sarrow i { display:block; font-style:normal; font-weight:700; font-size:18px; margin-top:-8px; color:#fff; text-shadow:0 0 6px #000, 0 0 3px #000; }
  .sarrow.hot { animation:sapulse .6s ease-in-out infinite alternate; }
  @keyframes sapulse { from { opacity:.75; filter:brightness(1); } to { opacity:1; filter:brightness(1.35); } }
  body.rm .sarrow.hot { animation:none; }
  body.cb .sarrow.hot b { color:#ffffff; text-shadow:0 0 12px #000, 0 0 20px #f2c14e; }
  #screen.hero .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 0 18px; }
  #screen.hero .chips span { padding:5px 14px; border-radius:999px; background:rgba(242,193,78,.12); border:1px solid rgba(242,193,78,.4); font-size:18px; color:#ffe8a8; }
  #screen.hero .hint { opacity:.75; font-size:18px; margin-top:16px; }
  #screen.hero::before { content:""; position:absolute; left:0; right:0; top:0; height:90px; background:linear-gradient(180deg, rgba(4,6,18,.85), transparent); pointer-events:none; }
  #screen.hero::after { content:""; position:absolute; left:0; right:0; bottom:0; height:130px; background:linear-gradient(0deg, rgba(4,6,18,.9), transparent); pointer-events:none; }
  #screen.hero .card { position:relative; z-index:2; }
  #flash { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, rgba(255,90,95,0) 40%, rgba(255,90,95,.7) 100%); opacity:0; transition:opacity .35s; }
  #flash.on { opacity:1; transition:none; }
  #fps { top:70px; right:12px; font-size:calc(18px * var(--fs)); display:none; }
  #screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(14,20,48,.74); text-align:center; }
  #screen.hidden { display:none; }
  #screen .card { max-width:640px; max-height:94vh; overflow-y:auto; box-sizing:border-box; padding:22px 34px; background:rgba(14,20,48,.94); border:1px solid rgba(242,193,78,.5); border-radius:18px; box-shadow:0 0 50px rgba(242,193,78,.18); }
  #screen h1 { margin:0 0 6px; font-size:calc(34px * var(--fs)); color:var(--gold); }
  #screen h2 { margin:0 0 10px; font-size:calc(18px * var(--fs)); font-weight:400; opacity:.8; letter-spacing:.12em; text-transform:uppercase; }
  #screen p { margin:8px 0; line-height:1.5; }
  #screen .big { font-size:calc(20px * var(--fs)); }
  #screen .quote { font-style:italic; opacity:.92; border-left:3px solid var(--gold); padding-left:12px; text-align:left; }
  #screen kbd, .help kbd { background:rgba(245,241,230,.14); border-radius:5px; padding:1px 6px; font-family:inherit; }
  #screen .go { margin-top:16px; font-size:calc(18px * var(--fs)); color:var(--gold); animation:pulse 1.4s infinite; }
  #screen button { display:block; width:100%; margin:8px 0; padding:11px 16px; font-size:calc(18px * var(--fs)); color:var(--ink); background:rgba(245,241,230,.08); border:1px solid rgba(245,241,230,.28); border-radius:10px; cursor:pointer; font-family:inherit; }
  #screen button.primary { border-color:var(--gold); color:var(--gold); }
  #screen button:hover, #screen button:focus { background:rgba(242,193,78,.18); outline:none; }
  #screen label { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:12px 0; }
  #screen input[type=range] { width:240px; }
  .help { font-size:calc(18px * var(--fs)); opacity:.82; text-align:left; line-height:1.9; }
  @keyframes pulse { 50% { opacity:.45; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="flash"></div>

<div class="hud box" id="flames" title="Ngọn lửa còn lại"></div>
<div class="hud box" id="timer"><span id="time">5:00</span><small id="nightName"></small></div>
<div class="hud box" id="topright">
  <div id="lanternCount">0/5 đèn</div>
  <div id="cap">✦ 0/10</div>
  <div id="score">0</div>
</div>
<div class="hud box" id="charm">🧣 Bùa Gió <span id="charmS"></span></div>
<div class="hud box" id="banner"></div>
<div class="hud box" id="subs" role="status" aria-live="polite"></div>
<div class="hud box" id="prompt"></div>
<div class="hud box" id="motebar"></div>
<div class="hud" id="cds">
  <div class="cd" id="cdDash"><b>»</b>Lướt<div class="fill"></div></div>
  <div class="cd" id="cdPulse"><b>✦</b>Tỏa sáng<div class="fill"></div></div>
</div>
<div id="arrow">➤</div>
<div id="arrow2">⚠</div>
<div class="hud box" id="fps"></div>

<div id="screen"><div class="card" id="card"></div></div>

<script>
  // Hien loi len man hinh thay vi de man hinh den tro tron (chi hien thi, khong lien quan luat choi).
  window.__ddlFatal = function (title, html) {
    var card = document.getElementById("card");
    card.innerHTML = "<h1>" + title + "</h1>" + html;
    document.getElementById("screen").classList.remove("hidden");
  };
  window.addEventListener("error", function (e) {
    if (document.querySelector("#card h1") && document.querySelector("#card h1").dataset.fatal) return;
    window.__ddlFatal("Có lỗi khi chạy game", "<p>Mở F12 → Console để xem chi tiết và gửi lại cho người phát triển.</p><p style='opacity:.7;font-size:18px'>" + String(e.message).replace(/</g, "&lt;") + "</p>");
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.__ddlFatal("Có lỗi khi chạy game", "<p>Mở F12 → Console để xem chi tiết.</p><p style='opacity:.7;font-size:18px'>" + String(e.reason && e.reason.message || e.reason).replace(/</g, "&lt;") + "</p>");
  });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
